[package]
name = "meetscribe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
hound = "3.5"
# Phase 2 — transcription pipeline (batch, post-capture).
rubato = "0.15"                                  # 16 kHz resample of native-rate capture WAVs
serde = { version = "1", features = ["derive"] } # TranscriptSegment (storage/export contract)
serde_json = "1"
# silero VAD (gates ASR). static-model embeds the 1.7 MB onnx (no model file to provision,
# no runtime download); pulls ort (ONNX Runtime, fetched at build time).
silero = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", features = ["static-model"] }

# macOS single-aggregate capture layer.
# cidre pinned to meetily's verified rev — the ported core_audio recipe compiles only against this API surface.
[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
ringbuf = "0.4.8"
# ASR engine. Metal is the always-on baseline; CoreML is gated behind our `coreml`
# feature (see [features]) so a broken CoreML build can never block the metal path.
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal"] }

[features]
default = []
coreml = ["whisper-rs/coreml"]
