[package]
name = "meetscribe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
hound = "3.5"
# Phase 2 — transcription pipeline (batch, post-capture).
rubato = "0.15"                                  # 16 kHz resample of native-rate capture WAVs
serde = { version = "1", features = ["derive"] } # TranscriptSegment (storage/export contract)
serde_json = "1"
# silero VAD (gates ASR). static-model embeds the 1.7 MB onnx (no model file to provision,
# no runtime download); pulls ort (ONNX Runtime, fetched at build time).
silero = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", features = ["static-model"] }

# Phase 3 — storage + export.
# sqlx: plaintext SQLite (0600). tls-none is REQUIRED — sqlx errors at compile time with
# default-features=false unless exactly one TLS backend is selected, even for local files.
# The sqlite feature statically bundles SQLite from source (deterministic version).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "tls-none"] }
# tokio: DB ops only — one current-thread runtime, block_on around sqlx. Already in the tree
# via cidre (byte/IO types), so this only selects the runtime features we call directly.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
# time: UTC date formatting for the Markdown export metadata (no local-offset — soundness footgun).
time = { version = "0.3", features = ["formatting", "macros"] }

# macOS single-aggregate capture layer.
# cidre pinned to meetily's verified rev — the ported core_audio recipe compiles only against this API surface.
[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
ringbuf = "0.4.8"
# Phase 4 daemon: SIGTERM/SIGINT handler + single-instance flock via raw syscalls. Bare libc
# (already in the tree transitively) keeps the low-level style — no signal-hook/ctrlc/fs2 wrappers.
libc = "0.2"
# ASR engine. Metal is the always-on baseline; CoreML is gated behind our `coreml`
# feature (see [features]) so a broken CoreML build can never block the metal path.
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal"] }

[features]
default = []
coreml = ["whisper-rs/coreml"]
